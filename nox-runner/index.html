<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#070b18"/>
<title>NOX RUNNER</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050816;color:#fff;font-family:system-ui,Arial,sans-serif;touch-action:none}.wrap{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#172554 0,#070b18 45%,#02040b 100%)}canvas{width:100%;height:100%;display:block}.hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font-weight:1000;letter-spacing:1px;font-size:18px}.score{background:#ffffff12;border:1px solid #ffffff20;border-radius:14px;padding:8px 12px;font-weight:800;backdrop-filter:blur(8px)}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#02040b99;backdrop-filter:blur(6px)}.card{width:min(420px,100%);text-align:center;background:#0d1428;border:1px solid #ffffff20;border-radius:26px;padding:26px;box-shadow:0 30px 80px #000a}.logo{width:78px;height:78px;border-radius:24px;margin:auto;display:grid;place-items:center;font-size:34px;font-weight:1000;background:linear-gradient(135deg,#22d3ee,#7c3aed);box-shadow:0 0 34px #22d3ee55}h1{margin:16px 0 6px;font-size:32px}p{opacity:.75;line-height:1.4}.btn{margin-top:14px;width:100%;border:0;border-radius:16px;padding:15px;font-weight:900;font-size:17px;color:#fff;background:linear-gradient(135deg,#2563eb,#7c3aed)}.small{font-size:12px;opacity:.55;margin-top:10px}.controls{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.ctrl{pointer-events:auto;width:84px;height:84px;border-radius:50%;border:1px solid #ffffff25;background:#ffffff12;color:#fff;font-size:30px;font-weight:900;backdrop-filter:blur(8px)}.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap"><canvas id="game"></canvas></div>
<div class="hud"><div class="brand">NOX RUNNER</div><div class="score" id="score">0</div></div>
<div class="controls" id="controls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
<div class="overlay" id="menu"><div class="card"><div class="logo">N</div><h1>NOX RUNNER</h1><p>Desvie dos obstáculos, pegue moedas e faça o maior recorde possível.</p><button class="btn" id="play">JOGAR</button><div class="small">Toque nos botões ◀ ▶ para mover</div></div></div>
<div class="overlay hide" id="gameover"><div class="card"><div class="logo">N</div><h1>GAME OVER</h1><p id="final">Pontuação: 0</p><p id="best">Recorde: 0</p><button class="btn" id="again">JOGAR DE NOVO</button></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const scoreEl=document.getElementById('score'),menu=document.getElementById('menu'),go=document.getElementById('gameover'),finalEl=document.getElementById('final'),bestEl=document.getElementById('best'),controls=document.getElementById('controls');
let running=false,last=0,score=0,speed=260,spawn=0,coinSpawn=0,items=[],coins=[],particles=[];let best=Number(localStorage.getItem('noxRunnerBest')||0);let moveL=false,moveR=false;
const player={x:W/2,y:H-130,w:48,h:58,vx:0};
function reset(){score=0;speed=260;spawn=0;coinSpawn=0;items=[];coins=[];particles=[];player.x=W/2;player.y=H-130;player.vx=0;scoreEl.textContent='0'}
function start(){reset();menu.classList.add('hide');go.classList.add('hide');controls.classList.remove('hide');running=true;last=performance.now();requestAnimationFrame(loop)}
function end(){running=false;controls.classList.add('hide');best=Math.max(best,Math.floor(score));localStorage.setItem('noxRunnerBest',best);finalEl.textContent='Pontuação: '+Math.floor(score);bestEl.textContent='Recorde: '+best;go.classList.remove('hide')}
function rnd(a,b){return Math.random()*(b-a)+a}
function rect(x,y,w,h,r=10){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function collide(a,b){return a.x<a.x+a.w&&a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function spawnObs(){let w=rnd(42,74);items.push({x:rnd(14,W-w-14),y:-90,w,h:rnd(46,78),rot:rnd(-.12,.12)})}
function spawnCoin(){coins.push({x:rnd(28,W-48),y:-50,w:26,h:26,t:0})}
function burst(x,y){for(let i=0;i<12;i++)particles.push({x,y,vx:rnd(-90,90),vy:rnd(-120,40),life:1})}
function update(dt){score+=dt*12;speed=Math.min(680,260+score*0.55);spawn-=dt;coinSpawn-=dt;if(spawn<=0){spawnObs();spawn=Math.max(.28,1.0-score/900)}if(coinSpawn<=0){spawnCoin();coinSpawn=rnd(1.3,2.3)}
 player.vx+=(moveR?1:0-(moveL?1:0))*1500*dt;player.vx*=Math.pow(.001,dt);player.x+=player.vx*dt;player.x=Math.max(10,Math.min(W-player.w-10,player.x));player.y=H-130;
 for(const o of items)o.y+=speed*dt;for(const k of coins){k.y+=speed*.9*dt;k.t+=dt}items=items.filter(o=>o.y<H+100);coins=coins.filter(k=>k.y<H+80&&!k.got);
 for(const o of items)if(hit(player,o))return end();
 for(const k of coins)if(hit(player,k)){k.got=true;score+=50;burst(k.x+13,k.y+13)}
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;p.life-=dt*1.7}particles=particles.filter(p=>p.life>0);scoreEl.textContent=Math.floor(score)}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1532');g.addColorStop(1,'#030610');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.22;ctx.strokeStyle='#60a5fa';ctx.lineWidth=2;for(let i=0;i<7;i++){let x=W*(i/6);ctx.beginPath();ctx.moveTo(W/2,H*.2);ctx.lineTo(x,H);ctx.stroke()}for(let y=H*.25;y<H;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.globalAlpha=1;
 for(const o of items){ctx.save();ctx.translate(o.x+o.w/2,o.y+o.h/2);ctx.rotate(o.rot);ctx.fillStyle='#ef4444';ctx.shadowColor='#ef4444';ctx.shadowBlur=18;rect(-o.w/2,-o.h/2,o.w,o.h,12);ctx.restore()}
 for(const k of coins){ctx.save();ctx.translate(k.x+13,k.y+13);ctx.rotate(k.t*5);ctx.fillStyle='#facc15';ctx.shadowColor='#facc15';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#713f12';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('N',0,1);ctx.restore()}
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='#facc15';ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;
 ctx.save();ctx.translate(player.x+player.w/2,player.y+player.h/2);ctx.fillStyle='#22d3ee';ctx.shadowColor='#22d3ee';ctx.shadowBlur=25;rect(-player.w/2,-player.h/2,player.w,player.h,14);ctx.fillStyle='#08111f';ctx.font='900 25px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('N',0,1);ctx.restore();}
function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}
function hold(el,set){el.addEventListener('pointerdown',e=>{e.preventDefault();set(true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();set(false)}))}
hold(document.getElementById('left'),v=>moveL=v);hold(document.getElementById('right'),v=>moveR=v);document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;addEventListener('keydown',e=>{if(e.key==='ArrowLeft')moveL=true;if(e.key==='ArrowRight')moveR=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')moveL=false;if(e.key==='ArrowRight')moveR=false});draw();
</script>
</body>
</html>
