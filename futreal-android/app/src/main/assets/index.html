<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>futREAL</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06100c;font-family:Arial,sans-serif;color:#fff}button{font:inherit}#menu,#game{position:fixed;inset:0}#menu{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#1d5b39,#08170f 58%,#030805)}.card{width:min(86vw,520px);text-align:center;padding:28px;border:1px solid #ffffff22;border-radius:28px;background:#07120dcc;box-shadow:0 20px 70px #0008}.logo{font-size:56px;font-weight:1000;letter-spacing:-4px;margin:0}.logo span{color:#4ce783}.tag{opacity:.7;font-weight:700;font-size:12px;letter-spacing:2px;margin:4px 0 22px}.play{width:100%;padding:17px;border:0;border-radius:16px;background:linear-gradient(135deg,#42e17c,#a5ffc3);color:#07180f;font-size:20px;font-weight:1000}.small{margin-top:14px;font-size:11px;opacity:.55}#game{display:none;background:#07120c}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.score{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#04100cd9;border:1px solid #ffffff20;border-radius:14px;padding:8px 14px;font-weight:900;z-index:3}.score b{font-size:18px;margin:0 7px}.pause{position:absolute;right:12px;top:10px;width:42px;height:42px;border-radius:12px;border:1px solid #ffffff22;background:#06120dcc;color:white;font-weight:900;z-index:4}.joy{position:absolute;left:28px;bottom:26px;width:118px;height:118px;border-radius:50%;border:2px solid #ffffff2b;background:#04100c99;z-index:4;touch-action:none}.stick{position:absolute;left:33px;top:33px;width:52px;height:52px;border-radius:50%;background:#ffffff38;border:2px solid #ffffff44}.btn{position:absolute;border:0;border-radius:50%;font-weight:1000;color:#07180f;z-index:4;touch-action:none;box-shadow:0 7px 18px #0008}.shoot{right:24px;bottom:34px;width:78px;height:78px;background:#ffbe58}.pass{right:112px;bottom:91px;width:66px;height:66px;background:#67e69a}.run{right:123px;bottom:21px;width:58px;height:58px;background:#e3ffec;font-size:11px}.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#020805dd;z-index:8}.overlay .box{width:min(80vw,320px);padding:22px;border-radius:22px;background:#0b2117;border:1px solid #ffffff20;text-align:center}.overlay button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:13px;font-weight:900}.resume{background:#57e68c;color:#06140d}.quit{background:#ffffff12;color:#fff}.hint{position:absolute;left:50%;bottom:7px;transform:translateX(-50%);font-size:10px;opacity:.35;z-index:3;white-space:nowrap}@media(max-height:420px){.joy{width:104px;height:104px}.stick{left:29px;top:29px;width:46px;height:46px}.shoot{width:70px;height:70px}.pass{width:58px;height:58px}}</style></head><body><section id="menu"><div class="card"><h1 class="logo">fut<span>REAL</span></h1><div class="tag">MOBILE FOOTBALL • ALPHA</div><button class="play" id="play">JOGAR PARTIDA</button><div class="small">Build Android inicial • foco em jogabilidade e desempenho mobile</div></div></section><section id="game"><canvas id="c"></canvas><div class="score">FTR <b id="hs">0</b>—<b id="as">0</b> RIV &nbsp; <span id="clock">00:00</span></div><button class="pause" id="pause">Ⅱ</button><div class="joy" id="joy"><div class="stick" id="stick"></div></div><button class="btn shoot" id="shoot">CHUTE</button><button class="btn pass" id="pass">PASSE</button><button class="btn run" id="run">CORRER</button><div class="hint">Analógico • Passe • Chute • Correr</div><div class="overlay" id="ov"><div class="box"><h2>Jogo pausado</h2><button class="resume" id="resume">CONTINUAR</button><button class="quit" id="quit">SAIR</button></div></div></section><script>(()=>{const menu=document.querySelector('#menu'),game=document.querySelector('#game'),c=document.querySelector('#c'),x=c.getContext('2d'),joy=document.querySelector('#joy'),stick=document.querySelector('#stick'),clock=document.querySelector('#clock'),hs=document.querySelector('#hs'),as=document.querySelector('#as'),ov=document.querySelector('#ov');let W=0,H=0,d=1,last=0,t=0,running=false,paused=false,runBoost=false,scoreA=0,scoreB=0;const p={x:.30,y:.5,r:13,vx:0,vy:0},ball={x:.37,y:.5,r:7,vx:0,vy:0},enemy={x:.68,y:.5,r:13},keeper={x:.94,y:.5,r:14};let jx=0,jy=0,jid=null;function resize(){d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function reset(){p.x=.28;p.y=.5;ball.x=.36;ball.y=.5;ball.vx=ball.vy=0;enemy.x=.67;enemy.y=.5;keeper.x=.94;keeper.y=.5}function start(){menu.style.display='none';game.style.display='block';running=true;paused=false;t=0;scoreA=scoreB=0;hs.textContent=as.textContent='0';reset();last=performance.now();requestAnimationFrame(loop)}document.querySelector('#play').onclick=start;document.querySelector('#pause').onclick=()=>{paused=true;ov.style.display='flex'};document.querySelector('#resume').onclick=()=>{paused=false;ov.style.display='none';last=performance.now()};document.querySelector('#quit').onclick=()=>{running=false;ov.style.display='none';game.style.display='none';menu.style.display='flex'};function joyMove(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy)||1,lim=r.width*.34,k=Math.min(1,lim/m);jx=dx/m*k;jy=dy/m*k;stick.style.transform=`translate(${jx*lim}px,${jy*lim}px)`}joy.onpointerdown=e=>{jid=e.pointerId;joy.setPointerCapture(jid);joyMove(e)};joy.onpointermove=e=>{if(e.pointerId===jid)joyMove(e)};joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;stick.style.transform='translate(0,0)'}};document.querySelector('#run').onpointerdown=()=>runBoost=true;document.querySelector('#run').onpointerup=document.querySelector('#run').onpointercancel=()=>runBoost=false;function kick(power){const dx=ball.x-p.x,dy=ball.y-p.y;if(Math.hypot(dx,dy)<.09){let ax=jx,ay=jy;if(Math.hypot(ax,ay)<.12){ax=1;ay=0}const m=Math.hypot(ax,ay)||1;ball.vx=ax/m*power;ball.vy=ay/m*power}}document.querySelector('#shoot').onpointerdown=()=>kick(1.15);document.querySelector('#pass').onpointerdown=()=>kick(.72);function field(){x.fillStyle='#14763b';x.fillRect(0,0,W,H);const stripe=W/10;for(let i=0;i<10;i++){x.fillStyle=i%2?'#177d40':'#14763b';x.fillRect(i*stripe,0,stripe,H)}x.strokeStyle='#eafff2';x.lineWidth=2;const m=28;x.strokeRect(m,m,W-2*m,H-2*m);x.beginPath();x.moveTo(W/2,m);x.lineTo(W/2,H-m);x.stroke();x.beginPath();x.arc(W/2,H/2,Math.min(W,H)*.12,0,Math.PI*2);x.stroke();const boxW=W*.14,boxH=H*.42;x.strokeRect(m,H/2-boxH/2,boxW,boxH);x.strokeRect(W-m-boxW,H/2-boxH/2,boxW,boxH);x.lineWidth=4;x.strokeStyle='#fff';x.strokeRect(W-m-6,H*.39,12,H*.22)}function dot(o,color){x.beginPath();x.fillStyle=color;x.arc(o.x*W,o.y*H,o.r,0,Math.PI*2);x.fill();x.strokeStyle='#06100c';x.lineWidth=3;x.stroke()}function update(dt){t+=dt;const sp=(runBoost?.34:.24)*dt;p.x+=jx*sp;p.y+=jy*sp;p.x=Math.max(.05,Math.min(.95,p.x));p.y=Math.max(.08,Math.min(.92,p.y));const dx=ball.x-p.x,dy=ball.y-p.y,dist=Math.hypot(dx,dy);if(dist<.055&&Math.hypot(ball.vx,ball.vy)<.18){ball.x=p.x+(jx||1)*.05;ball.y=p.y+jy*.05}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const drag=Math.pow(.988,dt*60);ball.vx*=drag;ball.vy*=drag;if(ball.y<.05||ball.y>.95){ball.y=Math.max(.05,Math.min(.95,ball.y));ball.vy*=-.72}const edx=ball.x-enemy.x,edy=ball.y-enemy.y,em=Math.hypot(edx,edy)||1;enemy.x+=edx/em*.07*dt;enemy.y+=edy/em*.07*dt;enemy.x=Math.max(.48,Math.min(.88,enemy.x));enemy.y=Math.max(.12,Math.min(.88,enemy.y));keeper.y+=(ball.y-keeper.y)*Math.min(1,dt*1.8);keeper.y=Math.max(.37,Math.min(.63,keeper.y));for(const o of [enemy,keeper]){const qx=ball.x-o.x,qy=ball.y-o.y,q=Math.hypot(qx*W,qy*H);if(q<o.r+ball.r+4){const mm=Math.hypot(qx,qy)||1;ball.vx=qx/mm*.65;ball.vy=qy/mm*.65}}if(ball.x>.985&&ball.y>.39&&ball.y<.61){scoreA++;hs.textContent=scoreA;reset()}else if(ball.x>1.03){reset()}if(ball.x<-.03){scoreB++;as.textContent=scoreB;reset()}clock.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}function draw(){field();dot(enemy,'#ffcc60');dot(keeper,'#f5f5f5');dot(p,'#55e88c');dot(ball,'#fff');x.fillStyle='#08110c';x.font='bold 10px Arial';x.textAlign='center';x.fillText('VOCÊ',p.x*W,p.y*H-19)}function loop(now){if(!running)return;const dt=Math.min(.033,(now-last)/1000||.016);last=now;if(!paused)update(dt);draw();requestAnimationFrame(loop)}reset()})();</script></body></html>
