plugins {
    id 'com.android.application'
}

configurations { natives }

android {
    namespace 'com.nox.futreal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nox.futreal'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '8.0-elite-libgdx'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:${gdxVersion}"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-armeabi-v7a"
}

tasks.register('copyAndroidNatives') {
    doFirst {
        file('libs/armeabi-v7a').mkdirs()
        file('libs/arm64-v8a').mkdirs()
        configurations.natives.files.each { jar ->
            def out = jar.name.contains('arm64-v8a') ? file('libs/arm64-v8a') : file('libs/armeabi-v7a')
            copy {
                from zipTree(jar)
                into out
                include '**/*.so'
                eachFile { f -> f.path = f.name }
                includeEmptyDirs = false
            }
        }
    }
}

preBuild.dependsOn copyAndroidNatives
