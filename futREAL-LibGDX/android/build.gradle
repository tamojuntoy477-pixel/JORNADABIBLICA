plugins {
    id 'com.android.application'
}

configurations { natives }

android {
    namespace 'com.nox.futreal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nox.futreal'
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName '13.0-premium-match-libgdx'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['../assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:${gdxVersion}"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-armeabi-v7a"
}

tasks.register('copyAndroidNatives') {
    doFirst {
        file('libs/armeabi-v7a').mkdirs()
        file('libs/arm64-v8a').mkdirs()
        configurations.natives.files.each { jar ->
            def out = jar.name.contains('arm64-v8a') ? file('libs/arm64-v8a') : file('libs/armeabi-v7a')
            copy {
                from zipTree(jar)
                into out
                include '**/*.so'
                eachFile { f -> f.path = f.name }
                includeEmptyDirs = false
            }
        }
    }
}

// Pinned CC0 rigged footballer used by the active futREAL premium runtime.
// The source model has separate Shirt/Shirt2/Pants/Socks/Shoes materials and
// embedded skeletal clips. Source license: CC0 1.0 (Quaternius).
tasks.register('fetchHighFidelityAssets') {
    doLast {
        def dir = file('../assets/characters')
        dir.mkdirs()

        fileTree(dir: dir, include: ['night-striker.glb', 'universal-animation-library.glb']).each { it.delete() }

        def files = [
            'football-player.glb': 'https://raw.githubusercontent.com/kendrekaran/striker-3d/57847f87ff3d924712a1bb37df9dae391aedc315/assets/player.glb',
            'LICENSE-football-player.txt': 'https://raw.githubusercontent.com/kendrekaran/striker-3d/57847f87ff3d924712a1bb37df9dae391aedc315/assets/LICENSE-quaternius.txt'
        ]
        files.each { name, source ->
            def target = new File(dir, name)
            if (!target.exists() || target.length() < (name.endsWith('.glb') ? 100000L : 100L)) {
                logger.lifecycle("Downloading CC0 futREAL asset: ${name}")
                new URL(source).withInputStream { input ->
                    target.withOutputStream { output -> output << input }
                }
            }
            long minBytes = name.endsWith('.glb') ? 100000L : 100L
            if (!target.exists() || target.length() < minBytes) {
                throw new GradleException("High-fidelity asset download failed: ${name}")
            }
        }
    }
}

preBuild.dependsOn copyAndroidNatives, fetchHighFidelityAssets
