name: Build futREAL 5 Godot APK

on:
  push:
    branches: [ futreal-godot ]
    paths:
      - 'futREAL-Godot/**'
      - '.github/workflows/futreal-godot-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot 4.7.2
        run: |
          wget -q --show-progress "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          GODOT_BIN=$(find /tmp/godot-bin -maxdepth 1 -type f -name 'Godot*' | head -1)
          chmod +x "$GODOT_BIN"
          sudo mv "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Install Godot export templates
        run: |
          wget -q --show-progress "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -O /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/android_debug.apk"

      - name: Configure Android signing and editor paths
        run: |
          mkdir -p "$HOME/.local/share/godot/keystores"
          keytool -genkeypair -v \
            -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=futREAL Debug,O=NOX,C=BR"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Validate and export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.HOME }}/.local/share/godot/keystores/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p futREAL-Godot/build
          godot --headless --path futREAL-Godot --editor --quit
          godot --headless --path futREAL-Godot --export-debug Android build/futREAL-5.apk
          test -f futREAL-Godot/build/futREAL-5.apk
          ls -lh futREAL-Godot/build/futREAL-5.apk

      - name: Upload futREAL 5 APK
        uses: actions/upload-artifact@v4
        with:
          name: futREAL-5-Godot-apk
          path: futREAL-Godot/build/futREAL-5.apk
          if-no-files-found: error
