name: Build NOX Ultra AI APK
on:
  push:
    branches: [ "nox-ultra-ai-app" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: nox-ultra-ai-android
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NOX-ULTRA-AI-APK
          path: nox-ultra-ai-android/app/build/outputs/apk/debug/app-debug.apk
