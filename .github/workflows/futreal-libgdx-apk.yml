name: Build futREAL LibGDX APK

on:
  workflow_dispatch:
  push:
    branches: [ futreal-app ]
    paths:
      - 'futREAL-LibGDX/**'
      - '.github/workflows/futreal-libgdx-apk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build futREAL APK
        run: gradle -p futREAL-LibGDX :android:assembleDebug --stacktrace

      - name: Rename APK
        run: cp futREAL-LibGDX/android/build/outputs/apk/debug/android-debug.apk futREAL-LibGDX/futREAL-LibGDX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futREAL-LibGDX-apk
          path: futREAL-LibGDX/futREAL-LibGDX.apk
          if-no-files-found: error
