name: Build NOX Dragon Arena 3D APK

on:
  push:
    branches: [ nox-dragon-arena-3d ]
    paths:
      - 'NOX_Dragon_Arena_3D/**'
      - '.github/workflows/build-nox-dragon-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: NOX_Dragon_Arena_3D
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp NOX_Dragon_Arena_3D/app/build/outputs/apk/debug/app-debug.apk NOX-Dragon-Arena-3D.apk
          ls -lh NOX-Dragon-Arena-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOX-Dragon-Arena-3D-APK
          path: NOX-Dragon-Arena-3D.apk
          if-no-files-found: error
          retention-days: 30
