name: Build NOX Monsters HD APK

on:
  push:
    branches:
      - nox-monsters-3d-app
      - nox-monsters-hd-rework2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply HD renderer sources
        run: |
          cat nox-monsters-3d/hd_parts/part1.b64 nox-monsters-3d/hd_parts/part2.b64 nox-monsters-3d/hd_parts/part3.b64 nox-monsters-3d/hd_parts/part4.b64 nox-monsters-3d/hd_parts/part5.b64 | base64 -d > /tmp/nox-hd.tar.gz
          gzip -t /tmp/nox-hd.tar.gz
          tar -xzf /tmp/nox-hd.tar.gz -C nox-monsters-3d/app/src/main/java/com/nox/monsters3d

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p nox-monsters-3d :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp nox-monsters-3d/app/build/outputs/apk/debug/app-debug.apk NOX_Monsters_HD.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOX-Monsters-HD-APK
          path: NOX_Monsters_HD.apk
          if-no-files-found: error
          retention-days: 7
