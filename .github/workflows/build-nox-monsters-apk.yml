name: Build NOX Monsters 3D APK

on:
  push:
    branches:
      - nox-monsters-3d-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p nox-monsters-3d :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp nox-monsters-3d/app/build/outputs/apk/debug/app-debug.apk NOX_Monsters_3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOX-Monsters-3D-APK
          path: NOX_Monsters_3D.apk
          if-no-files-found: error
          retention-days: 7
