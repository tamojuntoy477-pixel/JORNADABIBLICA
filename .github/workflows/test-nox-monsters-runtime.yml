name: Test NOX Monsters 3D Runtime

on:
  push:
    branches:
      - nox-monsters-3d-app
    paths:
      - 'nox-monsters-3d/**'
      - '.github/workflows/test-nox-monsters-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p nox-monsters-3d :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r nox-monsters-3d/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.nox.monsters3d/.MainActivity || true
            sleep 8
            echo '=== PID ==='
            adb shell pidof com.nox.monsters3d || true
            echo '=== CRASH LOG ==='
            adb logcat -d -v time AndroidRuntime:E ActivityTaskManager:I ActivityManager:I *:S | tail -n 250
            echo '=== WINDOW ==='
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' || true
            if ! adb shell pidof com.nox.monsters3d >/dev/null; then
              echo 'APP_CRASHED=1'
              exit 1
            fi
