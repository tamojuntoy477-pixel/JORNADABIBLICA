name: Test NOX Monsters HD Runtime

on:
  push:
    branches:
      - nox-monsters-3d-app
      - nox-monsters-hd-rework2
    paths:
      - 'nox-monsters-3d/**'
      - '.github/workflows/test-nox-monsters-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply HD renderer sources
        run: |
          cat nox-monsters-3d/hd_parts/part1.b64 nox-monsters-3d/hd_parts/part2.b64 nox-monsters-3d/hd_parts/part3.b64 nox-monsters-3d/hd_parts/part4.b64 nox-monsters-3d/hd_parts/part5.b64 | base64 -d > /tmp/nox-hd.tar.gz
          gzip -t /tmp/nox-hd.tar.gz
          tar -xzf /tmp/nox-hd.tar.gz -C nox-monsters-3d/app/src/main/java/com/nox/monsters3d

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p nox-monsters-3d :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r nox-monsters-3d/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.nox.monsters3d/.MainActivity
            sleep 8
            echo '=== PID ==='
            PID=$(adb shell pidof com.nox.monsters3d | tr -d '\r')
            echo "$PID"
            echo '=== CRASH LOG ==='
            adb logcat -d -v time AndroidRuntime:E '*:S' | tail -n 120 || true
            test -n "$PID"
