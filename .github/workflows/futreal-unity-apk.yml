name: Build futREAL Unity APK

on:
  workflow_dispatch:
  push:
    branches:
      - futreal-app
    paths:
      - 'futREAL-Unity/**'
      - '.github/workflows/futreal-unity-apk.yml'

jobs:
  build-unity-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: futREAL-Unity
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          buildMethod: FutRealBuild.BuildAndroid

      - name: Upload futREAL Unity APK
        uses: actions/upload-artifact@v4
        with:
          name: futREAL-Unity-apk
          path: futREAL-Unity/Builds/Android/futREAL-Unity.apk
          if-no-files-found: error
