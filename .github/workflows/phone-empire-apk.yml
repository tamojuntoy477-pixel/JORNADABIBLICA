name: Build Phone Empire APK
on:
  push:
    branches: ["phone-empire-build-v2"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: phoneempire
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp phoneempire/app/build/outputs/apk/debug/app-debug.apk PhoneEmpire.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneEmpire-APK
          path: PhoneEmpire.apk
